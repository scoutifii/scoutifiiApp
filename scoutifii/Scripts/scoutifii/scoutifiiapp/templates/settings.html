{% extends 'base.html' %}
{% load static %}
{% load countries %}

{% block content %}

<div class="settings-box">
    <div class="settings-text">
        <h2>Signup</h2>
        <hr>
        <div class="">
            {% for message in messages %}
            {% if message == 0 %}
                <p class="alert alert-success fade show" role="alert">{{message}}</p>
                {% else %}
                <p class="alert alert-danger fade show" role="alert">{{message}}</p>
                {% endif %}
            {% endfor %}
        </div>  
        <form action="{% url 'settings' %}" method="post" enctype="multipart/form-data" class="form-horizontal">
            {% csrf_token %}
            {% for profile in profiles %}
            <textarea type="text" name="bio" rows="3" placeholder="Add Bio" required>{{profile.bio}}</textarea>
            <input type="text" name="phone_no" value="{{profile.phone_no}}" placeholder=" Add Phone No" required>
            <input type="text" name="birth_date" id="add_dob" value="{{profile.birth_date}}"  placeholder="Add Date of Birth" required >
            <input type="text" name="location" value="{{profile.location}}" required>
            <select name="country_id" required>
                <option value="">Select Country</option>
                {% get_countries as countries %}
                {% for country in countries %}
                <option value="{{ country.code }}">{{ country.name }}</option>
                {% endfor %}
            </select>
            <!-- <select name="profile_type_data" required="required">
                <option value="">Select Profile</option>
                {% if profile.profile_type_data == 'user' %}
                <option value="user" {{profile.profile_type_data}}>User</option>
                {% elif profile.profile_type_data == 'player' %}
                <option value="player" {{profile.profile_type_data}}>Player</option>
                {% elif profile.profile_type_data == 'coach' %}
                <option value="coach" {{profile.profile_type_data}}>Coach</option>
                {% elif profile.profile_type_data == 'agent' %}
                <option value="agent" {{profile.profile_type_data}} >Agent</option>
                {% endif %}
            </select> -->
             <select name="profile_type_data" value="{{profile.profile_type_data}}" required>
                <option value="">Select Profile</option>
                <option value="user">User</option>
                <option value="player">Player</option>
                <option value="coach">Coach</option>
                <option value="agent">Agent</option>
            </select> 
            <div class="row post-img">
                <img src="{{profile.profileimg.url}}" alt="" id="postImg">
                <label for="feed-pic-upload" class="feed-upload-button">
                    <span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                        <path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z">
                        </path>
                    </svg></span>
                    Upload a Photo
                </label>
                <input type="file" name="profileimg" id="feed-pic-upload" accept="image/jpg, image/png, image/jpeg">
            </div>
            {% endfor %}
            <button type="submit">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#FF0000" xmlns="http://www.w3.org/2000/svg"><title>Update</title>
                    <path d="M8.90002 7.55999C9.21002 3.95999 11.06 2.48999 15.11 2.48999H15.24C19.71 2.48999 21.5 4.27999 21.5 8.74999V15.27C21.5 19.74 19.71 21.53 15.24 21.53H15.11C11.09 21.53 9.24002 20.08 8.91002 16.54" stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12H14.88" stroke="#0000FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12.65 8.6499L16 11.9999L12.65 15.3499" stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Update
            </button>
        </form>            
    </div>
</div>
</div>
    </main>
{% endblock %}
